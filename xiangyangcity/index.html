<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>南宋襄樊 · 汉江古战图 (1267–1273)</title>
<meta name="description" content="南宋末年襄阳古城与浩荡汉江三维历史地图。青碧汉江水效、波光粼粼、群山环抱、襄樊双城对峙与宋蒙战役漫游。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet">
<style>
:root {
  --parchment-bg: #e2d6c3;
  --parchment-dark: #cbb9a0;
  --ink-black: #24201c;
  --ink-grey: #564d44;
  --ink-light: #887a6d;
  --vermilion: #993328;
  --ochre: #b58d53;
  --border-ink: rgba(65, 52, 40, 0.25);
  --shadow-ink: rgba(38, 32, 28, 0.18);
  --font-serif: "Noto Serif SC", "Songti SC", "SimSun", "STSong", serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  margin: 0;
  overflow: hidden;
  background: var(--parchment-bg);
  color: var(--ink-black);
  font-family: var(--font-serif);
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

#map-canvas {
  width: 100vw;
  height: 100vh;
  display: block;
  background: #c5b69f;
}

.vintage-overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(circle at 50% 45%, rgba(226, 214, 195, 0) 48%, rgba(135, 110, 80, 0.22) 90%, rgba(55, 42, 28, 0.42) 100%);
  mix-blend-mode: multiply;
}

/* Header */
header {
  position: fixed;
  top: 18px;
  left: 18px;
  z-index: 10;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 10px 18px;
  border: 1px solid var(--border-ink);
  border-radius: 8px;
  background: rgba(238, 230, 218, 0.94);
  backdrop-filter: blur(10px);
  box-shadow: 0 4px 18px var(--shadow-ink);
}

.seal-icon {
  width: 38px;
  height: 38px;
  background: var(--vermilion);
  color: #fff;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  font-size: 19px;
  letter-spacing: -1px;
  box-shadow: 0 2px 6px rgba(153, 51, 40, 0.38);
  border: 1px solid #7d241c;
}

.brand-text h1 {
  font-size: 18px;
  font-weight: 900;
  letter-spacing: 2.5px;
  color: var(--ink-black);
  line-height: 1.2;
}

.brand-text small {
  display: block;
  font-size: 10px;
  letter-spacing: 1.5px;
  color: var(--ink-grey);
  font-weight: 600;
  margin-top: 2px;
}

.era-badge {
  font-size: 11px;
  background: rgba(181, 141, 83, 0.18);
  color: #795524;
  padding: 3px 8px;
  border-radius: 4px;
  border: 1px solid rgba(181, 141, 83, 0.4);
  font-weight: 600;
  white-space: nowrap;
}



/* Tactical Controls */
.war-controls {
  position: fixed;
  top: 22px;
  left: 350px;
  z-index: 10;
  display: flex;
  gap: 6px;
  padding: 4px 8px;
  border-radius: 6px;
  background: rgba(238, 230, 218, 0.94);
  border: 1px solid var(--border-ink);
  font-size: 12px;
}

.war-controls button {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 5px 9px;
  border-radius: 4px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--ink-grey);
  font-family: inherit;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
}

.war-controls button[aria-pressed="true"] {
  background: rgba(153, 51, 40, 0.12);
  border-color: rgba(153, 51, 40, 0.35);
  color: var(--vermilion);
}

.indicator-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: currentColor;
}

/* Sidebar POI list */
aside#places-sidebar {
  position: fixed;
  top: 80px;
  left: 18px;
  bottom: 24px;
  width: 320px;
  z-index: 10;
  display: flex;
  flex-direction: column;
  border: 1px solid var(--border-ink);
  border-radius: 8px;
  background: rgba(240, 232, 221, 0.95);
  backdrop-filter: blur(12px);
  box-shadow: 0 8px 30px var(--shadow-ink);
  overflow: hidden;
}

.sidebar-header {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border-ink);
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(220, 206, 189, 0.45);
}

.sidebar-header h2 {
  font-size: 14px;
  font-weight: 900;
  letter-spacing: 1px;
  color: var(--ink-black);
}

.sidebar-header span {
  font-size: 11px;
  color: var(--ink-light);
}

.places-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.place-item {
  border: 1px solid rgba(140, 120, 95, 0.22);
  border-radius: 6px;
  padding: 9px 12px;
  background: rgba(247, 241, 232, 0.72);
  cursor: pointer;
  transition: all 0.2s;
  text-align: left;
}

.place-item:hover {
  background: rgba(255, 252, 246, 0.96);
  border-color: var(--ochre);
  transform: translateX(3px);
}

.place-item.active {
  background: #fdfaf4;
  border-color: var(--vermilion);
  box-shadow: 0 2px 8px rgba(153, 51, 40, 0.16);
}

.place-item-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 3px;
}

.place-name {
  font-size: 13px;
  font-weight: 900;
  color: var(--ink-black);
}

.place-tag {
  font-size: 10px;
  padding: 2px 5px;
  border-radius: 3px;
  background: rgba(181, 141, 83, 0.16);
  color: #795524;
  font-weight: 600;
}

.place-snippet {
  font-size: 11px;
  line-height: 1.4;
  color: var(--ink-grey);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* Detail Card Modal */
#detail-card {
  position: fixed;
  right: 24px;
  bottom: 24px;
  width: 360px;
  max-height: calc(100vh - 120px);
  z-index: 12;
  border-radius: 8px;
  border: 1px solid var(--border-ink);
  background: rgba(247, 240, 231, 0.96);
  box-shadow: 0 12px 40px rgba(45, 36, 28, 0.26);
  backdrop-filter: blur(14px);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  animation: slideUp 0.3s ease-out;
}

@keyframes slideUp {
  from { transform: translateY(20px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

.card-head {
  padding: 14px 18px 12px;
  border-bottom: 1px solid var(--border-ink);
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  background: rgba(226, 214, 198, 0.55);
}

.card-title-group h2 {
  font-size: 17px;
  font-weight: 900;
  letter-spacing: 1px;
  color: var(--ink-black);
}

.card-title-group small {
  font-size: 11px;
  color: var(--ink-light);
  letter-spacing: 0.5px;
}

.close-btn {
  background: none;
  border: none;
  color: var(--ink-light);
  font-size: 18px;
  cursor: pointer;
  padding: 2px 6px;
  border-radius: 4px;
}
.close-btn:hover { color: var(--ink-black); background: rgba(0,0,0,0.06); }

.card-body {
  padding: 16px 18px;
  overflow-y: auto;
  font-size: 13px;
  line-height: 1.65;
  color: #382e25;
}

.card-field {
  margin-bottom: 12px;
}

.card-label {
  font-size: 10px;
  letter-spacing: 1px;
  font-weight: 900;
  color: var(--ochre);
  text-transform: uppercase;
  margin-bottom: 3px;
}

.quote-box {
  margin: 12px 0 6px;
  padding: 10px 12px;
  border-left: 3px solid var(--vermilion);
  background: rgba(153, 51, 40, 0.06);
  font-style: italic;
  color: #48332c;
  font-size: 12px;
  border-radius: 0 4px 4px 0;
}

/* Floating HUD Controls */
.hud-tools {
  position: fixed;
  right: 24px;
  top: 18px;
  z-index: 10;
  display: flex;
  gap: 8px;
}

.hud-btn {
  width: 40px;
  height: 40px;
  border-radius: 8px;
  border: 1px solid var(--border-ink);
  background: rgba(238, 230, 218, 0.94);
  color: var(--ink-black);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 3px 12px var(--shadow-ink);
  transition: all 0.15s;
}

.hud-btn:hover {
  background: #fdfaf4;
  transform: translateY(-2px);
}

.hud-btn svg {
  width: 18px;
  height: 18px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.vintage-seal {
  position: fixed;
  right: 28px;
  bottom: 24px;
  pointer-events: none;
  font-size: 12px;
  font-weight: 900;
  color: rgba(153, 51, 40, 0.7);
  writing-mode: vertical-rl;
  border: 2px solid rgba(153, 51, 40, 0.6);
  padding: 8px 4px;
  letter-spacing: 5px;
  border-radius: 4px;
  background: rgba(245, 235, 220, 0.25);
}

@media (max-width: 860px) {
  
  .war-controls { left: 18px; top: 76px; }
  aside#places-sidebar {
    top: auto;
    bottom: 0;
    left: 0;
    right: 0;
    width: 100vw;
    height: 280px;
    border-radius: 14px 14px 0 0;
  }
  #detail-card {
    right: 12px;
    left: 12px;
    width: auto;
    bottom: 290px;
  }
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

<canvas id="map-canvas"></canvas>
<div class="vintage-overlay"></div>

<!-- Brand Header -->
<header>
  <div class="seal-icon">宋</div>
  <div class="brand-text">
    <h1>南宋襄樊 · 汉江古战图</h1>
    <small>BATTLE OF XIANGYANG & HAN RIVER · 1267–1273</small>
  </div>
  <div class="era-badge">咸淳抗蒙烽火</div>
</header>



<!-- Tactical Layer Toggles -->
<div class="war-controls" role="group" aria-label="战局图层">
  <button id="toggle-walls" aria-pressed="true"><span class="indicator-dot"></span>城池堡垒</button>
  <button id="toggle-fleet" aria-pressed="true"><span class="indicator-dot"></span>江防战船</button>
  <button id="toggle-trebuchet" aria-pressed="true"><span class="indicator-dot"></span>攻城炮阵</button>
</div>

<!-- Floating Tool Buttons -->
<div class="hud-tools">
  <button id="btn-reset" class="hud-btn" title="重置全景视角">
    <svg viewBox="0 0 24 24"><path d="M3 10a9 9 0 1 1 1 7M3 4v6h6"/></svg>
  </button>
  <button id="btn-rotate" class="hud-btn" title="自动旋转漫游">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 9 9h-3"/></svg>
  </button>
</div>

<!-- Places Sidebar -->
<aside id="places-sidebar">
  <div class="sidebar-header">
    <h2>城防与战阵要录</h2>
    <span>点击飞越巡视</span>
  </div>
  <div class="places-list" id="places-container"></div>
</aside>

<!-- Detail Card -->
<div id="detail-card" style="display:none;">
  <div class="card-head">
    <div class="card-title-group">
      <h2 id="card-name">地标名称</h2>
      <small id="card-en">ENGLISH TITLE</small>
    </div>
    <button class="close-btn" id="card-close">&times;</button>
  </div>
  <div class="card-body">
    <div class="card-field">
      <div class="card-label">历史战事与防御体系</div>
      <div id="card-summary"></div>
    </div>
    <div class="card-field">
      <div class="card-label">建置与地理形胜</div>
      <div id="card-features"></div>
    </div>
    <div class="card-field">
      <div class="card-label">存续沿革</div>
      <div id="card-period"></div>
    </div>
    <div class="quote-box" id="card-quote"></div>
  </div>
</div>

<div class="vintage-seal">襄陽制置司印</div>

// -------------------------------------------------------------
// Shader & Palette Customization: Song Dynasty Ink-Wash Engine
// -------------------------------------------------------------
function applyInkWashShader(material) {
  material.onBeforeCompile = (shader) => {
    shader.fragmentShader = shader.fragmentShader.replace(
      '#include <dithering_fragment>',
      `#include <dithering_fragment>
      // Classical Ink-Wash Quantization
      float lum = dot(gl_FragColor.rgb, vec3(0.299, 0.587, 0.114));
      float inkTone = 1.0;
      if (lum < 0.24) inkTone = 0.48;
      else if (lum < 0.46) inkTone = 0.72;
      else if (lum < 0.72) inkTone = 0.90;
      
      vec3 parchmentTint = vec3(0.87, 0.80, 0.70);
      gl_FragColor.rgb = mix(gl_FragColor.rgb * inkTone, gl_FragColor.rgb * parchmentTint, 0.22);
      `
    );
  };
}

// Materials Palette
const matWall = new THREE.MeshStandardMaterial({

// -------------------------------------------------------------
// Grand Expansive Terrain & Mountain Ranges (岘山、万山、鹿门山)
// -------------------------------------------------------------
// Han River bank curves: x from -1000 to 1000
function getRiverBounds(x) {
  const t = Math.max(0.0, Math.min(1.0, (x + 1000.0) / 2000.0));
  const zSouth = -240.0 + 50.0 * t + 40.0 * (t * t);
  const zNorth = -390.0 + 70.0 * t + 50.0 * (t * t);
  return { south: zSouth, north: zNorth };
}

// Expansive Mountain peaks across the Southern, Western, and Eastern horizon
const mountainRanges = [
  // [x, z, amplitude, sigmaX, sigmaZ]
  // 岘山核心群峰 (South)
  [0, 320, 95, 170, 130],      // 岘山主峰
  [-220, 380, 88, 160, 140],   // 扁山
  [240, 360, 92, 160, 130],    // 岘首山
  [-110, 230, 65, 120, 95],    // 砚山 / 真武山
  // 南面崇山峻岭远脉 (Far South Horizon)
  [-450, 560, 120, 240, 190],
  [0, 620, 135, 280, 210],
  [450, 540, 115, 250, 190],
  [-750, 480, 110, 260, 200],
  [750, 460, 105, 250, 200],

  // 万山天险与西面群峰 (West)
  [-360, -220, 85, 140, 110],  // 万山峡口
  [-580, -160, 105, 200, 160], // 西部连峦
  [-750, 110, 95, 210, 180],
  [-880, -260, 115, 240, 190],

  // 鹿门山与东部群峦 (East & Southeast)
  [420, 190, 88, 160, 140],    // 鹿门山
  [620, 320, 105, 210, 170],
  [780, 140, 95, 220, 180],

  // 樊城以北缓坡岗丘 (North)
  [-260, -620, 55, 220, 150],
  [220, -590, 50, 200, 140],
  [0, -750, 80, 300, 180]
];

function getTerrainHeight(x, z) {
  const rb = getRiverBounds(x);
  // If point is in Han River channel, depress into riverbed (-1.5 to 0.0)
  if (z >= rb.north - 15.0 && z <= rb.south + 15.0) {
    const center = (rb.north + rb.south) * 0.5;
    const halfW = (rb.south - rb.north) * 0.5;
    const dist = Math.abs(z - center) / halfW;
    if (dist < 1.0) {
      return -1.6 * Math.cos(dist * Math.PI * 0.5); // Concave riverbed
    }
  }

  // Inside Xiangyang Ancient City walls: flat historical foundation
  if (x > -95 && x < 95 && z > -190 && z < 25) return 2.2;

  let h = 2.0;
  for (let [hx, hz, amp, sx, sz] of mountainRanges) {
    let dx = (x - hx) / sx;
    let dz = (z - hz) / sz;
    h += amp * Math.exp(-(dx * dx + dz * dz));
  }
  return h;
}

// Expansive Terrain Mesh: 1900 x 1900 units
const terrainWidth = 1900;
const terrainDepth = 1900;
const terrainSegs = 180;
const terrainGeo = new THREE.PlaneGeometry(terrainWidth, terrainDepth, terrainSegs, terrainSegs);
terrainGeo.rotateX(-Math.PI / 2);

const posAttr = terrainGeo.attributes.position;
const terrainColors = [];
const colParchment = new THREE.Color(0xdcc8ab); // Lowland ancient parchment
const colHill = new THREE.Color(0x828a68);      // Mid hill moss & ochre
const colMountain = new THREE.Color(0x383e35);  // High peak pine ink
const tempColor = new THREE.Color();

for (let i = 0; i < posAttr.count; i++) {
  const x = posAttr.getX(i);
  const z = posAttr.getZ(i);
  const y = getTerrainHeight(x, z);
  posAttr.setY(i, y);

  if (y < 4.0) {
    tempColor.copy(colParchment);
  } else if (y < 40.0) {
    let t = (y - 4.0) / 36.0;
    tempColor.copy(colParchment).lerp(colHill, t);
  } else {
    let t = Math.min(1.0, (y - 40.0) / 60.0);
    tempColor.copy(colHill).lerp(colMountain, t);
  }
  terrainColors.push(tempColor.r, tempColor.g, tempColor.b);
}
terrainGeo.setAttribute('color', new THREE.Float32BufferAttribute(terrainColors, 3));
terrainGeo.computeVertexNormals();

const terrainMat = new THREE.MeshStandardMaterial({
  vertexColors: true,
  roughness: 0.96,
  metalness: 0.04,
  flatShading: true
});
applyInkWashShader(terrainMat);

const terrainMesh = new THREE.Mesh(terrainGeo, terrainMat);
terrainMesh.receiveShadow = true;
scene.add(terrainMesh);

  transparent: true,
  opacity: 0.94

// Inject Fresnel reflection and water depth shimmer
waterMaterial.onBeforeCompile = (shader) => {
  shader.fragmentShader = shader.fragmentShader.replace(
    '#include <dithering_fragment>',
    `#include <dithering_fragment>
    // Fresnel Reflection for Liquid Water (波光与天光反射)
    vec3 viewDir = normalize(vViewPosition);
    float fresnel = pow(1.0 - max(0.0, dot(viewDir, normal)), 3.0);
    
    vec3 skyReflect = vec3(1.0, 0.96, 0.88); // Sun glint reflection
    vec3 deepCyan = vec3(0.06, 0.48, 0.58);   // Pure river cyan-blue
    gl_FragColor.rgb = mix(deepCyan, skyReflect, fresnel * 0.72);
    gl_FragColor.rgb += vec3(0.02, 0.12, 0.15); // Vibrant oceanic depth
    `
  );
};

// Generate Parametric River Grid Ribbon across whole horizon (x: -950 to +950)
const riverNx = 160;
const riverNz = 28;
const riverGeo = new THREE.BufferGeometry();
const riverPositions = [];
const riverIndices = [];

for (let i = 0; i <= riverNx; i++) {
  const u = i / riverNx;
  const rx = -950.0 + u * 1900.0;
  const rb = getRiverBounds(rx);

  for (let j = 0; j <= riverNz; j++) {
    const v = j / riverNz;
    const rz = rb.south + v * (rb.north - rb.south);
    riverPositions.push(rx, 1.4, rz);
  }
}

for (let i = 0; i < riverNx; i++) {
  for (let j = 0; j < riverNz; j++) {
    const a = i * (riverNz + 1) + j;
    const b = (i + 1) * (riverNz + 1) + j;
    const c = (i + 1) * (riverNz + 1) + (j + 1);
    const d = i * (riverNz + 1) + (j + 1);
    riverIndices.push(a, b, d);
    riverIndices.push(b, c, d);
  }
}

riverGeo.setAttribute('position', new THREE.Float32BufferAttribute(riverPositions, 3));
riverGeo.setIndex(riverIndices);
riverGeo.computeVertexNormals();

      moatShape.lineTo(mPts[i][0], -mPts[i][1]);

// Interactive Navigation, Flying Camera & UI
// -------------------------------------------------------------

const detailCard = document.getElementById('detail-card');

let currentActiveItem = null;

let flyStartCam = new THREE.Vector3();
let flyEndCam = new THREE.Vector3();
let flyStartTar = new THREE.Vector3();
let flyEndTar = new THREE.Vector3();
let flyProgress = 0;
let flyDuration = 60;

function flyTo(targetPos, cameraPos) {
  flyStartCam.copy(camera.position);
  flyEndCam.set(...cameraPos);
  flyStartTar.copy(controls.target);
  flyEndTar.set(...targetPos);
  flyProgress = 0;
  isFlying = true;
}

// Generate POI Items

  const item = document.createElement('div');

  if (index === 0) item.classList.add('active');

  item.innerHTML = `
    <div class="place-item-top">
      <span class="place-name">${loc.name}</span>
      <span class="place-tag">${loc.tag}</span>
    </div>

  `;

  item.onclick = () => {

});

function selectLocation(loc, elem) {
  if (currentActiveItem) currentActiveItem.classList.remove('active');
  elem.classList.add('active');
  currentActiveItem = elem;

  flyTo(loc.target, loc.camera);

  // Update Detail Card
  cardName.textContent = loc.name;
  cardEn.textContent = loc.en;
  cardSummary.textContent = loc.summary;
  cardFeatures.textContent = loc.features;
  cardPeriod.textContent = loc.period;
  cardQuote.textContent = loc.quote;
  detailCard.style.display = 'flex';
}

// Window Resize Handling
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Render Loop with Real-Time Fluid River Wave Simulation
let clock = new THREE.Clock();
const riverPos = riverGeo.attributes.position;
const baseRiverY = new Float32Array(riverPos.count);
for (let i = 0; i < riverPos.count; i++) {
  baseRiverY[i] = riverPos.getY(i);
}

let frameCount = 0;

function animate() {
  requestAnimationFrame(animate);

  const delta = clock.getDelta();
  const time = clock.getElapsedTime();
  frameCount++;

  // 1. Dynamic Rolling River Waves (真实波光与江水流动)
  for (let i = 0; i < riverPos.count; i++) {
    const rx = riverPos.getX(i);
    const rz = riverPos.getZ(i);
    // Compound sinusoidal wave flowing eastward along the Han River
    const wave = Math.sin(rx * 0.04 - time * 2.5 + rz * 0.05) * 0.65
               + Math.cos(rz * 0.07 + time * 1.8 + rx * 0.03) * 0.40
               + Math.sin((rx + rz) * 0.05 - time * 3.0) * 0.15;
    riverPos.setY(i, baseRiverY[i] + wave);
  }
  riverPos.needsUpdate = true;

  // Recompute normals every 2 frames for glistening specular wave glints
  if (frameCount % 2 === 0) {
    riverGeo.computeVertexNormals();
  }

  // 2. Warships gently bobbing and rocking on the waves
  fleetGroup.children.forEach((ship, idx) => {
    ship.position.y = 1.4 + Math.sin(time * 2.2 + idx * 1.2) * 0.18;
    ship.rotation.z = Math.sin(time * 1.8 + idx) * 0.03;
    ship.rotation.x = Math.cos(time * 1.4 + idx) * 0.02;
  });

  // 3. Camera Fly Transition
  if (isFlying) {
    flyProgress++;
    let t = flyProgress / flyDuration;
    let ease = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

    camera.position.lerpVectors(flyStartCam, flyEndCam, ease);
    controls.target.lerpVectors(flyStartTar, flyEndTar, ease);

    if (flyProgress >= flyDuration) {
      isFlying = false;
    }
  }

  controls.update();
  renderer.render(scene, camera);
}

animate();
setTimeout(() => {
  selectLocation(LOCATIONS[0], placesContainer.firstElementChild);
}, 200);
